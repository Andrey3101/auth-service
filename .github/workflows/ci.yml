# CI auth-service: ruff, pytest, миграции Alembic на PostgreSQL 16
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Ruff
        run: ruff check --select F,E9,B --ignore B008 .
      - name: Pytest
        run: pytest -q

  migrations:
    name: alembic upgrade + check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clerkai
          POSTGRES_PASSWORD: clerkai
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clerkai -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://clerkai:clerkai@localhost:5432/auth_db
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      SERVICE_TOKEN: ci-service-token
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Миграции на пустой базе
        run: python -m app.migrate
      - name: Модели совпадают со схемой (alembic check)
        run: alembic check
      - name: Повторный запуск миграций идемпотентен
        run: python -m app.migrate
