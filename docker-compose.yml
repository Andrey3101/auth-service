version: "3.8"
services:
  auth-service-1:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgres://user:password@db:5432/auth_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=your_secret_key
    depends_on:
      - db
      - redis
      - rabbitmq
  auth-service-2:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DB_URL=postgres://user:password@db:5432/auth_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=your_secret_key
    depends_on:
      - db
      - redis
      - rabbitmq
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
  redis:
    image: redis:6
  rabbitmq:
    image: rabbitmq:3-management
volumes:
  auth_db_data: