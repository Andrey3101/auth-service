version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: postgresql://postgres:mysecretpassword@host.docker.internal:5432/postgres
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
      JWT_SECRET: your-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - app-network


  redis:
    image: redis:6
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: