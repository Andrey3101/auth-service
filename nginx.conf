events {
    worker_connections 1024;
}

http {
    upstream auth_backend {
        least_conn;
        server auth-service-1:8000;
        server auth-service-2:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}